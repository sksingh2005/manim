services:
  api:
    build:
      context: ./backend
      target: api
    init: true
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - manim-jobs:/tmp/manim-jobs
      - manim-state:/tmp/manim-state
    depends_on:
      - renderer
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  renderer:
    build:
      context: ./backend
      target: renderer
    init: true
    environment:
      JOBS_DIR: /tmp/manim-jobs
      RENDER_TIMEOUT_SEC: 300
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - manim-jobs:/tmp/manim-jobs
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 4
    mem_limit: 8g
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.3
    profiles: ["reuse"]
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  manim-jobs:
  manim-state:
  qdrant-data:
